<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    
    <img src="/img/image1.jpg"  width="300" height="300">
    <img src="/img/image2.jpg"  width="300" height="300">
    <img src="/img/image3.jpg"  width="300" height="300">

    <script>
    // Отримуємо всі зображення на сторінці
    const images = document.querySelectorAll('img');

    // Для кожного зображення додаємо обробник події
    images.forEach((image) => {
        image.onclick = function() {
            // Отримуємо атрибут width через getAttribute
            console.log(image.getAttribute('width'));
        };
    });
    </script>

</body>
</html>
