<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Фотографії мене та моїх друзів.">
    <title>Фотографії друзів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-body">
    <main class="page gallery-page">
        <h1>Я та мої друзі</h1>
        <p>На сторінці розміщені фотографії Андрія, Михайла та моя.</p>
        <section class="photo-gallery" aria-label="Фотографії">
            <figure class="photo-card">
                <img src="image/andrew.jpg" alt="Андрій" width="768" height="1365" border="3">
                <figcaption>Мій друг Андрій</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="image/michael.jpg" alt="Михайло з гітарою" width="768" height="1365" border="3">
                <figcaption>Мій друг Михайло</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="image/maxym.jpg" alt="Я з гітарою" width="768" height="1365" border="3">
                <figcaption>Це я</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
