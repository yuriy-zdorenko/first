<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Завдання 2</title>
    <style>
       
        body {
            background-color: #f3f0f9;
            font-family: 'Segoe UI';
            padding: 30px;
        }


        .card-section {
            margin-bottom: 25px;
            padding: 22px 28px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(92, 107, 192, 0.12);
        }

        .section-lavender {
            background-color: #e8eaf6;
            border-left: 6px solid #5c6bc0;
        }

        .section-violet {
            background-color: #ede7f6;
            border-left: 6px solid #7e57c2;
        }

        .poem-part-1 {
            color: #1a237e;
            font-family: Georgia, serif;
            font-size: 15pt;
            font-style: italic;
            line-height: 1.85;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .poem-part-2 {
            color: #311b92;
            font-family: 'Trebuchet MS';
            font-size: 14pt;
            font-weight: 600;
            line-height: 1.95;
            letter-spacing: 0.8px;
            margin: 0;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="card-section section-lavender">
        <p class="poem-part-1">
            І ти ясна, і я прозорий,<br>
            І душі наші мов пісні,<br>
            І світ великий, неозорий<br>
            Належить нам – тобі й мені.
        </p>
    </div>

    <div class="card-section section-violet">
        <p class="poem-part-2">
            О море радості безкрає,<br>
            Чи я тебе перепливу?<br>
            Якби того, що в мріях маю,<br>
            Хоч краплю мати наяву.
        </p>
    </div>

</body>
</html>
