<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Карта Полтави</title>
</head>
<body bgcolor="#fff8e1">

    <center>
        <h1><font color="#1b5e20" face="verdana">Інтерактивна карта Полтави</font></h1>

        <p>
            <font face="verdana" size="3">
                Наведіть курсор на об'єкт, щоб побачити підказку.
            </font>
        </p>

        <img src="image/poltava_map.png" alt="Схема Полтави" width="800" height="500" border="4"
             usemap="#poltavamap">

        <map name="poltavamap">
            <!-- багатокутник: Корпусний парк -->
            <area shape="poly" coords="80,80,230,60,300,130,260,230,140,250,70,170"
                  href="#" alt="Корпусний парк"
                  title="Корпусний парк — зелена зона в центрі міста для прогулянок і відпочинку.">

            <!-- коло: Кругла площа -->
            <area shape="circle" coords="520,190,55"
                  href="#" alt="Кругла площа"
                  title="Кругла площа — серце Полтави, від якої променями розходяться вулиці. У центрі стоїть Монумент Слави.">

            <!-- коло: Біла альтанка -->
            <area shape="circle" coords="680,70,40"
                  href="#" alt="Біла альтанка"
                  title="Біла альтанка на Івановій горі — символ Полтави, збудована 1909 року до 200-річчя Полтавської битви.">

            <!-- прямокутник: пам'ятник галушці -->
            <area shape="rect" coords="380,300,460,350"
                  href="#" alt="Пам'ятник галушці"
                  title="Пам'ятник полтавській галушці — жартівливий знак на честь головної страви краю.">

            <!-- багатокутник: річка Ворскла -->
            <area shape="poly" coords="0,380,150,350,300,380,450,430,600,420,800,360,800,440,600,500,450,500,300,450,150,420,0,450"
                  href="#" alt="Річка Ворскла"
                  title="Ворскла — річка, на берегах якої розкинулася Полтава.">
        </map>
    </center>

</body>
</html>
