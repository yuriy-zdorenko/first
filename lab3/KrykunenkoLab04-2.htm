   <TITLE>Горизонтальні рядки - Завдання 4.1</TITLE>

<BODY BGCOLOR="#222222" TEXT="#FFFFFF">
<H1 ALIGN="CENTER">5 Горизонтальних рядків</H1>

<!-- 1. Текст у рядку коливається з боку в бік -->
<MARQUEE BEHAVIOR="alternate" BGCOLOR="#FF5555" HEIGHT="40">
   <FONT SIZE="5">1. Цей текст коливається з боку в бік.</FONT>
</MARQUEE><BR><BR>

<!-- 2. Текст пробігає справа наліво та з’являється знову -->
<MARQUEE DIRECTION="left" BEHAVIOR="scroll" BGCOLOR="#55FF55" HEIGHT="40">
   <FONT SIZE="5" COLOR="#000000">2. Цей текст пробігає справа наліво і з'являється знову.</FONT>
</MARQUEE><BR><BR>

<!-- 3. Текст у рядку пробігає  зліва направо та зупиняється -->
<MARQUEE DIRECTION="right" BEHAVIOR="slide" BGCOLOR="#5555FF" HEIGHT="40">
   <FONT SIZE="5">3. Цей текст пробігає зліва направо і ЗУПИНЯЄТЬСЯ назавжди.</FONT>
</MARQUEE><BR><BR>

<!-- 4. Запізнення 1 (Швидкий рух, мала затримка) -->
<MARQUEE SCROLLDELAY="10" BGCOLOR="#FFFF55" HEIGHT="40">
   <FONT SIZE="5" COLOR="#000000">4. Дуже швидкий текст (затримка 10 мілісекунд).</FONT>
</MARQUEE><BR><BR>

<!-- 5. Запізнення 2 (Повільний рух, велика затримка) -->
<MARQUEE SCROLLDELAY="400" BGCOLOR="#FF55FF" HEIGHT="40">
   <FONT SIZE="5" COLOR="#000000">5. Дуже повільний текст (затримка 400 мілісекунд).</FONT>
</MARQUEE>

</BODY>
</HTML>
