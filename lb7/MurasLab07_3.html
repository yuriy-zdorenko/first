<html>
    <head>
        <meta charset="utf-8">
        <title>Анкета</title>

    </head>
    <body bgcolor="4ee9a7" text="2f3231">
        <form>
            <table align="center" border="3">
                <tr align="center">
                    <th colspan="3">
                        <h2 align="center"><font color="red">Анкета</font></h2>
                    </th>
                </tr>
                <tr align="left">
                    <td>
                        1.
                    </td>
                    <td>
                        Прізвище
                    </td>
                    <td>
                        <input type="text" name="last_name" maxlength="15">
                    </td>
                </tr>
                <tr align="left">
                    <td>
                        2.
                    </td>
                    <td>
                        Ім'я, по-батькові
                    </td>
                    <td>
                        <input type="text" name="name" maxlength="40">
                    </td>
                </tr>
                <tr align="left">
                    <td>
                        3.
                    </td>
                    <td>
                        Число і рік народження
                    </td>
                    <td>
                        <input type="date" name="date" maxlength="10">
                    </td>
                </tr>
                <tr align="left">
                    <td>
                        4.
                    </td>
                    <td>
                        Домашня адреса
                    </td>
                    <td>
                        <input type="text" name="addres" maxlength="60">
                    </td>
                </tr>
                <tr align="left">
                    <td>
                        5. 
                    </td>
                    <td>
                        Місце навчання (роботи)
                    </td>
                    <td>
                        <input type="text" name="work" maxlength="150">
                    </td>
                </tr>
                <tr align="left">
                    <td>
                        6.
                    </td>
                    <td>
                        E-mail
                    </td>
                    <td>
                        <input type="email" name="email" maxlength="40">
                    </td>
                </tr>
                <tr align="left">
                    <td rowspan="6" align="center" valign="top">8.</td>
                    <td rowspan="6" valign="top">Область наукових інтересів</td>
                    <td style="border: none;">1. <input type="text" name="interst2" maxlength="60"></td>
                </tr>
                <tr >
                    <td style="border: none;">2. <input type="text" name="interst2" maxlength="60"></td>
                </tr>
                <tr>
                    <td style="border: none;">3. <input type="text" name="interst3" maxlength="60"></td>
                </tr>
                <tr>
                    <td style="border: none;">4. <input type="text" name="interst4" maxlength="60"></td>
                </tr>
                <tr>
                    <td style="border: none;">5. <input type="text" name="interst5" maxlength="60"></td>
                </tr>
                <tr>
                    <td style="border: none;">6. <input type="text" name="interst6" maxlength="60"></td>
                </tr>
                <tr>
                    <td style="border: none;"colspan="3"><input type="reset" name="reset" value="Відмінити введення" size="3"></td>
                    
                </tr>
                <tr >
                    <td style="border: none;" colspan="3"><input type="submit" name="send" value="Надіслати дані та перейти до 2 етапу реєстрації" size="3"></td>
                </tr>
                
            </table>
        </form>
    </body>
</html>
