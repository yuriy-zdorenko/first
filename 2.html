<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Рядки що біжать</title>
</head>

<body>

   <marquee behavior="alternate" bgcolor="#FFD700" height="50" width="100%">
      <font face="Verdana" size="4" color="#000000"><b>Текст коливається з боку в бік</b></font>
   </marquee>

   <marquee behavior="scroll" direction="left" bgcolor="#87CEFA" height="50" width="100%">
      <font face="Arial" size="4" color="#8B0000"><b>Текст пробігає справа наліво та з’являється знову</b></font>
   </marquee>

   <marquee behavior="slide" direction="right" bgcolor="#90EE90" height="50" width="100%">
      <font face="Tahoma" size="4" color="#00008B"><b>Текст пробігає зліва направо та зупиняється</b></font>
   </marquee>

   <marquee behavior="scroll" direction="left" scrollamount="3" scrolldelay="150" bgcolor="#FFA07A" height="50" width="100%">
      <font face="Georgia" size="4" color="#4B0082"><b>Текст рухається з невеликим запізненням</b></font>
   </marquee>

   <marquee behavior="scroll" direction="right" scrollamount="6" scrolldelay="300" bgcolor="#DDA0DD" height="50" width="100%">
      <font face="Courier New" size="4" color="#006400"><b>Текст рухається з іншим режимом запізнення</b></font>
   </marquee>

</body>
</html>
