<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <TITLE>Карта університетського містечка - Група 303-ТН</TITLE>
    </head>
    <body>
        <center>
            <h1>Локації нашої групи 303-ТН (Полтавська політехніка)</h1>
            <p>Наведіть курсор на будівлі на карті, щоб дізнатися інформацію про корпуси!</p>
            <br>
            <!-- Навігаційна карта для плану університету -->
            <map name="polytech_map">
                <!-- 1. Центральний корпус -->
                <area shape="poly" coords="370,315,560,245,665,315,540,400" href="#" title="1. Центральний корпус — головна будівля університетів, найкрасивіша та 
                новітня архітектурна споруда закладу.">

                <!-- 4. Корпус «Ф»  -->
                <area shape="poly" coords="630,160,675,140,690,160,645,180" href="#" title="4. Корпус «Ф» - навчальний корпус">

                <!-- 6. Корпус «П» -->
                <area shape="poly" coords="640,280,790,220,815,255,665,325" href="#" title="6. Корпус «П» — навчальний корпус">
            </map>
            <!-- Зображення плану території -->
            <img src="image/map_university.jpg" width="960" height="719" alt="План території університету" usemap="#polytech_map" border="0">

        </center>

        </body>
</html>
