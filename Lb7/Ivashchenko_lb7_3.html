<HTML>
<HEAD>
<meta charset=utf-8>
    <TITLE>Завдання 3</TITLE>
</HEAD>
<BODY>

<FORM ACTION="#" METHOD="POST">
    <TABLE BORDER="1" BGCOLOR="#E0FFFF" CELLPADDING="6" CELLSPACING="4" ALIGN="center">
       
        <TR>
            <TH COLSPAN="3" ALIGN="center">
                <FONT COLOR="red" SIZE="5"><B>Анкета</B></FONT>
            </TH>
        </TR>

        <TR>
            <TD ALIGN="center">1.</TD>
            <TD>Прізвище</TD>
            <TD><INPUT TYPE="text" NAME="surname" SIZE="40"></TD>
        </TR>

        <TR>
            <TD ALIGN="center">2.</TD>
            <TD>Ім'я, по-батькові</TD>
            <TD><INPUT TYPE="text" NAME="name" SIZE="40"></TD>
        </TR>

        <TR>
            <TD ALIGN="center">3.</TD>
            <TD>Число і рік народження</TD>
            <TD><INPUT TYPE="text" NAME="birthdate" SIZE="40"></TD>
        </TR>
        
        <TR>
            <TD ALIGN="center">4.</TD>
            <TD>Домашня адреса</TD>
            <TD><INPUT TYPE="text" NAME="address" SIZE="40"></TD>
        </TR>
        
        <TR>
            <TD ALIGN="center">5.</TD>
            <TD>Місце навчання (роботи)</TD>
            <TD><INPUT TYPE="text" NAME="workplace" SIZE="40"></TD>
        </TR>
        
        <TR>
            <TD ALIGN="center">6.</TD>
            <TD>Домашній (робочий) телефон</TD>
            <TD><INPUT TYPE="text" NAME="phone" SIZE="40"></TD>
        </TR>
        
        <TR>
            <TD ALIGN="center">7.</TD>
            <TD>E-mail</TD>
            <TD><INPUT TYPE="text" NAME="email" SIZE="40"></TD>
        </TR>
        
        <TR>
            <TD VALIGN="top" ALIGN="center">8.</TD>
            <TD VALIGN="top">Область наукових інтересів</TD>
            <TD>
                <OL>
                    <LI><INPUT TYPE="text" NAME="interest1" SIZE="33"></LI>
                    <LI><INPUT TYPE="text" NAME="interest2" SIZE="33"></LI>
                    <LI><INPUT TYPE="text" NAME="interest3" SIZE="33"></LI>
                    <LI><INPUT TYPE="text" NAME="interest4" SIZE="33"></LI>
                    <LI><INPUT TYPE="text" NAME="interest5" SIZE="33"></LI>
                    <LI><INPUT TYPE="text" NAME="interest6" SIZE="33"></LI>
                </OL>
            </TD>
        </TR>
        
        <TR>
            <TD COLSPAN="3">
                <INPUT TYPE="reset" VALUE="Відмінити введення">
                <BR><BR>
                <INPUT TYPE="submit" VALUE="Надіслати дані та перейти до 2 етапу реєстрації">
            </TD>
        </TR>
    </TABLE>
</FORM>
