<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заняття 10 — Grid Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #1e293b;
      font-family: Arial, sans-serif;
    }
    .wrapper {
      display: grid;
      min-height: 100vh;
      width: 100%;
      padding: 3px;
      gap: 6px;
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(120px, 1fr);
    }
    .box {
      padding: 16px;
      border: 1px solid #e5e7eb;
      color: #ffffff;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .b1 { background-color: #2563eb; }
    .b2 { background-color: #0d9488; }
    .b3 { background-color: #d97706; }
    .b4 { background-color: #7c3aed; }
    .b5 { background-color: #dc2626; }
    .b6 { background-color: #4f46e5; }

    /* < 500px — базова 1 колонка вже задана */

    /* >= 500px */
    @media (min-width: 500px) {
      .wrapper {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* >= 750px */
    @media (min-width: 750px) {
      .wrapper {
        grid-template-columns: repeat(2, 1fr);
      }
      .b1, .b6 {
        grid-column: 1 / -1;
      }
    }

    /* >= 950px */
    @media (min-width: 950px) {
      .wrapper {
        grid-template-columns: repeat(6, 1fr);
      }
      .b1 {
        grid-column: 1 / -1;
      }
      .b2, .b3, .b4 {
        grid-column: span 2;
      }
      .b5 {
        grid-column: 1 / span 3;
      }
      .b6 {
        grid-column: 4 / span 3;
      }
    }

    /* >= 1200px */
    @media (min-width: 1200px) {
      .wrapper {
        grid-template-columns: repeat(4, 1fr);
      }
      .b1 {
        grid-column: 1 / -1;
      }
      .b2, .b3, .b4, .b5 {
        grid-column: span 1;
      }
      .b6 {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="box b1">Блок 1 (Header)</div>
    <div class="box b2">Блок 2</div>
    <div class="box b3">Блок 3</div>
    <div class="box b4">Блок 4</div>
    <div class="box b5">Блок 5</div>
    <div class="box b6">Блок 6 (Footer)</div>
  </div>
</body>
</html>
