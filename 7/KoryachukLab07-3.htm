<HTML>
<HEAD>
    <meta charset="UTF-8">
    <TITLE>Анкета</TITLE>
    <meta name="Description" content="Форма для заповнення анкети користувача">
    <meta name="Keywords" content="форма, HTML, лабораторна робота 7">
</HEAD>
<BODY BGCOLOR="#FFFFFF" TEXT="#000000">
    <H2 ALIGN="CENTER"><FONT FACE="Georgia" COLOR="#1A237E">Завдання 3: форма для заповнення анкети</FONT></H2>
    <FORM ACTION="KoryachukLab07-1-result.htm" METHOD="POST">
    <TABLE BORDER="1" CELLPADDING="8" CELLSPACING="2" BGCOLOR="#E0F7FA" WIDTH="540" ALIGN="CENTER">
        <TR>
            <TD COLSPAN="3" ALIGN="CENTER"><FONT COLOR="RED" SIZE="7" FACE="Times New Roman"><B>Анкета</B></FONT></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">1.</TD>
            <TD>Прізвище</TD>
            <TD><INPUT TYPE="text" NAME="surname" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">2.</TD>
            <TD>Ім'я, по батькові</TD>
            <TD><INPUT TYPE="text" NAME="name" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">3.</TD>
            <TD>Число і рік народження</TD>
            <TD><INPUT TYPE="text" NAME="birth" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">4.</TD>
            <TD>Домашня адреса</TD>
            <TD><INPUT TYPE="text" NAME="address" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">5.</TD>
            <TD>Місце навчання (роботи)</TD>
            <TD><INPUT TYPE="text" NAME="work" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">6.</TD>
            <TD>Домашній (робочий) телефон</TD>
            <TD><INPUT TYPE="text" NAME="phone" SIZE="40"></TD>
        </TR>
        <TR>
            <TD ALIGN="CENTER">7.</TD>
            <TD>E-mail</TD>
            <TD><INPUT TYPE="text" NAME="email" SIZE="40"></TD>
        </TR>
        <TR VALIGN="TOP">
            <TD ALIGN="CENTER">8.</TD>
            <TD>Область наукових інтересів</TD>
            <TD>
            <OL>
                <LI><INPUT TYPE="text" NAME="interest1" SIZE="30"></LI>
                <LI><INPUT TYPE="text" NAME="interest2" SIZE="30"></LI>
                <LI><INPUT TYPE="text" NAME="interest3" SIZE="30"></LI>
                <LI><INPUT TYPE="text" NAME="interest4" SIZE="30"></LI>
                <LI><INPUT TYPE="text" NAME="interest5" SIZE="30"></LI>
                <LI><INPUT TYPE="text" NAME="interest6" SIZE="30"></LI>
            </OL>
            </TD>
        </TR>
        <TR>
            <TD COLSPAN="3">
                <INPUT TYPE="reset" VALUE="Відмінити введення"><BR><BR>
                <INPUT TYPE="submit" VALUE="Надіслати дані та перейти до 2 етапу реєстрації">
            </TD>
        </TR>
    </TABLE>
    </FORM>
</BODY>
</HTML>
