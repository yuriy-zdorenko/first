<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Анкета — 1 етап реєстрації</title>
</head>
<body>
  <h2>Самостійна робота, завдання 2. Форма заповнення анкети</h2>

  <form action="success.htm" method="get" target="_blank">
    <table border="1" cellpadding="6" cellspacing="2" bgcolor="#E0FFFF" width="600">
      <tr>
        <th colspan="3"><font color="#B22222" size="5">Анкета</font></th>
      </tr>
      <tr>
        <td>1.</td>
        <td>Прізвище</td>
        <td><input type="text" name="surname" size="35" maxlength="50"></td>
      </tr>
      <tr>
        <td>2.</td>
        <td>Ім'я, по батькові</td>
        <td><input type="text" name="fullname" size="35" maxlength="80"></td>
      </tr>
      <tr>
        <td>3.</td>
        <td>Число і рік народження</td>
        <td><input type="text" name="birthdate" size="35" maxlength="30"></td>
      </tr>
      <tr>
        <td>4.</td>
        <td>Домашня адреса</td>
        <td><input type="text" name="address" size="35" maxlength="100"></td>
      </tr>
      <tr>
        <td>5.</td>
        <td>Місце навчання (роботи)</td>
        <td><input type="text" name="place" size="35" maxlength="100"></td>
      </tr>
      <tr>
        <td>6.</td>
        <td>Домашній (робочий) телефон</td>
        <td><input type="text" name="phone" size="35" maxlength="30"></td>
      </tr>
      <tr>
        <td>7.</td>
        <td>E-mail</td>
        <td><input type="text" name="email" size="35" maxlength="60"></td>
      </tr>
      <tr>
        <td rowspan="6">8.</td>
        <td rowspan="6">Область наукових інтересів</td>
        <td>1. <input type="text" name="interest1" size="30"></td>
      </tr>
      <tr>
        <td>2. <input type="text" name="interest2" size="30"></td>
      </tr>
      <tr>
        <td>3. <input type="text" name="interest3" size="30"></td>
      </tr>
      <tr>
        <td>4. <input type="text" name="interest4" size="30"></td>
      </tr>
      <tr>
        <td>5. <input type="text" name="interest5" size="30"></td>
      </tr>
      <tr>
        <td>6. <input type="text" name="interest6" size="30"></td>
      </tr>
      <tr>
        <td colspan="3">
          <input type="reset" value="Відмінити введення"><br><br>
          <input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
