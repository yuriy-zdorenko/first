<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Вертикальні рухомі рядки</title>
	</head>

	<body bgcolor="#F0F7FF">
		<h1 align="CENTER">Вертикальні рухомі рядки</h1>

		<table width="100%" cellspacing="10">
			<tr>
				<td align="CENTER">
					<h3>1. Коливання</h3>

					<marquee
						DIRECTION="UP"
						BEHAVIOR="ALTERNATE"
						BGCOLOR="#FFD6E0"
						WIDTH="220"
						HEIGHT="250"
					>
						<center>
							<font color="#8B004B" size="5"> Вивчаємо HTML! </font>
							<br /><br />
							<img
								src="images/flower.png"
								width="60"
								height="60"
								alt="Квітка"
							/>
						</center>
					</marquee>
				</td>

				<td align="CENTER">
					<h3>2. Рух знизу вгору</h3>

					<marquee
						DIRECTION="UP"
						BEHAVIOR="SCROLL"
						BGCOLOR="#C8E6C9"
						WIDTH="220"
						HEIGHT="250"
					>
						<center>
							<img src="images/star.png" width="60" height="60" alt="Зірка" />
							<br />
							<img src="images/star.png" width="60" height="60" alt="Зірка" />
							<br />
							<img src="images/star.png" width="60" height="60" alt="Зірка" />
						</center>
					</marquee>
				</td>

				<td align="CENTER">
					<h3>3. Рух згори вниз із зупинкою</h3>

					<marquee
						DIRECTION="DOWN"
						BEHAVIOR="SLIDE"
						BGCOLOR="#FFF9C4"
						WIDTH="220"
						HEIGHT="250"
					>
						<center>
							<img src="images/sun.png" width="60" height="60" alt="Сонце" />
							<br />
							<img src="images/sun.png" width="60" height="60" alt="Сонце" />
						</center>
					</marquee>
				</td>
			</tr>
		</table>

		<br />

		<table width="100%" cellspacing="10">
			<tr>
				<td align="CENTER">
					<h3>4. Швидкий вертикальний рух</h3>

					<marquee
						DIRECTION="UP"
						BEHAVIOR="SCROLL"
						SCROLLDELAY="50"
						SCROLLAMOUNT="5"
						BGCOLOR="#D1C4E9"
						WIDTH="350"
						HEIGHT="250"
					>
						<center>
							<font color="#4527A0" size="5"> Швидкий рух інформації! </font>
						</center>
					</marquee>
				</td>

				<td align="CENTER">
					<h3>5. Повільний вертикальний рух</h3>

					<marquee
						DIRECTION="UP"
						BEHAVIOR="SCROLL"
						SCROLLDELAY="200"
						SCROLLAMOUNT="5"
						BGCOLOR="#B3E5FC"
						WIDTH="350"
						HEIGHT="250"
					>
						<center>
							<font color="#01579B" size="5"> Повільний рух інформації! </font>
						</center>
					</marquee>
				</td>
			</tr>
		</table>
	</body>
</html>
