<html>
    <head>
        <meta charset="utf-8">
        <title>Моя батьківщина</title>
    </head>
    <body bgcolor="blue" text="yellow">
        <h1 align="center">
            <b>Моя батьківщина</b>            
        </h1>
        <br>
        <center>
        <map name="map1">
            <area shape="rect" href="#" coords="0, 0, 300, 260" border="2" title="
            Полтава — це затишне й мальовниче місто на берегах Ворскли, що славиться своєю багатою історією, 
            видатними діячами культури та знаменитими полтавськими галушками.">
            
        </map>
        <map name="map2">
            <area shape="rect" href="#" coords="0, 0, 300, 260" border="2" title="
            Київ — це велична стародавня столиця України на пагорбах Дніпра, відома своїми золотоверхими 
            храмами, квітучими каштанами та багатовіковою спадщиною.">
        </map>

        <img src="image/poltava.jpg" width="300" height="260" alt="Полтава" usemap="#map1">
        <img src="image/Kiev.jpg" width="300" height="260" alt="Київ" usemap="#map2">
        </center>
    </body>
