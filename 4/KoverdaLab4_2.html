<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Горизонтальні рядки, що біжуть</title>
</head>              
<BODY BGCOLOR="#F0F8FF" TEXT="#000000">
   <P ALIGN="CENTER">
   <BR>
   
    <marquee width="800" bgColor="#FFB6C1" height="50" behavior="alternate">
        <FONT color="#8B0000" FACE="Arial" Size="4"><B>1. Текст коливається з боку в бік</B></FONT>
    </marquee>
    <BR><BR>

    <marquee width="800" bgColor="#ADD8E6" height="50" direction="left" behavior="scroll">
        <FONT color="#00008B" FACE="Verdana" Size="4"><I>2. Текст пробігає справа наліво та з'являється знову</I></FONT>
    </marquee>
    <BR><BR>

    <marquee width="800" bgColor="#98FB98" height="50" direction="right" behavior="slide">
        <FONT color="#006400" FACE="Tahoma" Size="4"><B>3. Текст пробігає зліва направо та зупиняється</B></FONT>
    </marquee>
    <BR><BR>

    <marquee width="800" bgColor="#FFD700" height="50" scrolldelay="200" scrollamount="3">
        <FONT color="#B8860B" FACE="Times New Roman" Size="4"><I>4. Рядок з більшим запізненням та повільною швидкістю</I></FONT>
    </marquee>
    <BR><BR>

    <marquee width="800" bgColor="#D8BFD8" height="50" scrolldelay="30" scrollamount="8">
        <FONT color="#4B0082" FACE="Courier New" Size="4"><B>5. Рядок з меншим запізненням та високою швидкістю</B></FONT>
    </marquee>
    <BR><BR>
   </P>
</BODY>
</html>
