<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Горизонтальні рухомі рядки</title>
	</head>

	<body bgcolor="#F0F7FF">
		<h1 align="CENTER">Горизонтальні рухомі рядки</h1>

		<h3>1. Коливання з боку в бік</h3>
		<marquee BEHAVIOR="ALTERNATE" BGCOLOR="#FFD6E0" HEIGHT="50">
			<font color="#8B004B" size="5"> Вивчати HTML цікаво! </font>
		</marquee>

		<h3>2. Рух справа наліво</h3>
		<marquee DIRECTION="LEFT" BEHAVIOR="SCROLL" BGCOLOR="#C8E6C9" HEIGHT="50">
			<font color="#1B5E20" size="5"> Сучасні технології змінюють світ! </font>
		</marquee>

		<h3>3. Рух зліва направо із зупинкою</h3>
		<marquee DIRECTION="RIGHT" BEHAVIOR="SLIDE" BGCOLOR="#FFF9C4" HEIGHT="50">
			<font color="#E65100" size="5"> Ласкаво просимо на вебсторінку! </font>
		</marquee>

		<h3>4. Швидкий рух тексту</h3>
		<marquee
			DIRECTION="LEFT"
			SCROLLDELAY="50"
			SCROLLAMOUNT="5"
			BGCOLOR="#D1C4E9"
			HEIGHT="50"
		>
			<font color="#4527A0" size="5"> Швидкий рух інформації </font>
		</marquee>

		<h3>5. Повільний рух тексту</h3>
		<marquee
			DIRECTION="LEFT"
			SCROLLDELAY="200"
			SCROLLAMOUNT="5"
			BGCOLOR="#B3E5FC"
			HEIGHT="50"
		>
			<font color="#01579B" size="5"> Повільний рух інформації </font>
		</marquee>
	</body>
</html>
