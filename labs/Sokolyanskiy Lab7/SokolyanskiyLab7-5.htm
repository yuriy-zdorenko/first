<ol>
<li><h3>Сукуленти та кактуси</h3>

<li>Ехеверія</li>
</ul>

<li>Спатифілум (Жіноче щастя)</li>
</ul>
</li>
<li><h3>Ампельні рослини</h3>
<ul type="square">
<li>Плющ звичайний</li>

</ul>
</li>
