<!doctype html>
     <html>
<head>
   <meta charset="utf-8">
   <title>Рядок, що біжить</title>
</head>		
<body background="images/fon.jpg" text="#FFFAFA">
  <p align="center">
    <br><br><br>
    <marquee width="800" bgcolor="#99ff00" height="50" behavior="alternate" scrollamount="6">
      <font color="#8b008b" face="Verdana" size="4"><b><i>1. Текст у рядку коливається з боку в бік.</i></b></font>
    </marquee>
    <br><br>
    <marquee width="800" bgcolor="#ff9999" height="50" direction="rtl" behavior="scroll" scrollamount="6">
      <font color="#000000" face="Verdana" size="4"><b>2. Текст пробігає справа наліво та з’являється знову.</b></font>
    </marquee>
    <br><br>
    <marquee width="800" bgcolor="#99ccff" height="50" direction="ltr" behavior="slide" scrollamount="6">
      <font color="#000080" face="Verdana" size="4"><b>3. Текст у рядку пробігає зліва направо та зупиняється.</b></font>
    </marquee>
    <br><br>
    <marquee width="800" bgcolor="#ffff99" height="50" behavior="scroll" scrollamount="3" scrolldelay="30">
      <font color="#800000" face="Verdana" size="4"><b>4. Рядок з меншим запізненням .</b></font>
    </marquee>
    <br><br>
    <marquee width="800" bgcolor="#cc99ff" height="50" behavior="scroll" scrollamount="3" scrolldelay="120">
      <font color="#003300" face="Verdana" size="4"><b>5. Рядок з більшим запізненням .</b></font>
    </marquee>
    <br><br>
  </p>
</body>
</html>
