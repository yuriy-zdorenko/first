<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблиця 75%</title>
</head>
<body>
    <table width="75%" border="1" align="center">
        <tr>
            <td colspan="2" align="center">Заголовок</td>
        </tr>
        <tr>
            <td width="25%" align="left">Дані, вирівняні по лівому краю комірки</td>
            <td width="75%" align="right">Дані, вирівняні по правому краю комірки</td>
        </tr>
        <tr>
            <td width="25%" align="left">25% ширини таблиці</td>
            <td width="75%" align="left">75% ширини таблиці</td>
        </tr>
    </table>
</body>
</html>
