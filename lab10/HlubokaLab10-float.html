<html>
    <head>
        <title>Float</title>
        <meta charset="utf-8">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            .wrapper{
                width: 100%;
                border: 1px;
            }
            .gray{
                float: right;
                height: 80%;
                width: 20%;
                background-color: gray;
                margin-bottom: 3px;
            }
            .blue{
                float: left;
                height: 30%;
                width: 80%;            
                background-color: cadetblue;
                margin-bottom: 3px;
            }
            .cyan{
                float: left;
                height: 20%;
                width: 25%;
                background-color: cyan;
                margin-bottom: 3px;
            }
            .red{
                float: left;
                height: 20%;
                width: 25%;
                background-color: crimson;
                margin-bottom: 3px;
            }
            .green{
                float: left;
                height: 30%;
                width: 50%;
                background-color: darkolivegreen;
                margin-bottom: 3px;
            }
            .yellow{
                float: right;
                height: 50%;
                width: 30%;
                background-color: yellow;
                margin-bottom: 3px;
            }
            .brown{
                clear: both;
                height: 20%;
                width: 100%;
                background-color: chocolate;
                margin-bottom: 3px;
            }
            div{
                border: 1px solid white;
            }
            @media (max-width: 500px) {
                .blue, .gray, .cyan, .brown, .green, .red, .yellow {
                    width: 100%;
                    float: none;
                }
            }
            @media (min-width: 501px) {
                .cyan, .red{
                    width: 50%;
                    float: left;
                }
            }
            @media (min-width: 750px){
                .cyan, .red {
                    width: 25%;
                }
                .green {
                    width: 50%;
                }
                .yellow {
                    width: 30%;
                }
            }
            @media (min-width: 1200px) {
                .wrapper {
                    max-width: 1200px;
                    margin: 0 auto; /* Центрує макет посередині екрана */
                }
            }

        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="blue"></div>
            <div class="gray"></div>
            <div class="cyan"></div>
            <div class="red"></div>
            <div class="yellow"></div>
            <div class="green"></div>
            <div class="brown"></div>
        </div>
    </body>
</html>
