<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Анкета</title>
    </head>
    <body>

        <form action="success.html" target="_blank">
            <table border="1" cellpadding="5" cellspacing="3" bgcolor="#E0F7FA" align="center">
                <tr>
                    <td colspan="3" align="center">
                        <h1><font color="red">Анкета</font></h1>
                    </td>
                </tr>
                <tr>
                    <td align="center" width="30">1.</td>
                    <td width="200">Прізвище</td>
                    <td><input type="text" name="lastname" size="40"></td>
                </tr>
                <tr>
                    <td align="center">2.</td>
                    <td>Ім'я, по батькові</td>
                    <td><input type="text" name="firstname" size="40"></td>
                </tr>
                <tr>
                    <td align="center">3.</td>
                    <td>Число і рік народження</td>
                    <td><input type="text" name="birthdate" size="40"></td>
                </tr>
                <tr>
                    <td align="center">4.</td>
                    <td>Домашня адреса</td>
                    <td><input type="text" name="address" size="40"></td>
                </tr>
                <tr>
                    <td align="center">5.</td>
                    <td>Місце навчання (роботи)</td>
                    <td><input type="text" name="place" size="40"></td>
                </tr>
                <tr>
                    <td align="center">6.</td>
                    <td>Домашній (робочий) телефон</td>
                    <td><input type="text" name="phone" size="40"></td>
                </tr>
                <tr>
                    <td align="center">7.</td>
                    <td>E-mail</td>
                    <td><input type="text" name="email" size="40"></td>
                </tr>
                <tr>
                    <td align="center" valign="top">8.</td>
                    <td valign="top">Область наукових інтересів</td>
                    <td>
                        1. <input type="text" name="interest1" size="35"><br>
                        2. <input type="text" name="interest2" size="35"><br>
                        3. <input type="text" name="interest3" size="35"><br>
                        4. <input type="text" name="interest4" size="35"><br>
                        5. <input type="text" name="interest5" size="35"><br>
                        6. <input type="text" name="interest6" size="35">
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="reset" value="Відмінити введення"><br><br>
                        <input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації">
                    </td>
                </tr>

            </table>
        </form>

    </body>
</html>
