<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="author" content="Kalinichenko">
    <meta name="description" content="Лабораторна робота №7 - Анкета">
    <title>Анкета</title>
</head>
<body bgcolor="#ffffff" text="#000000">

    <h2 align="center">Завдання 2: Анкета</h2>

    <form action="#" method="get">
        <table width="80%" align="center" border="1" cellpadding="6" cellspacing="0" bgcolor="#e0f7f7">
            <tr>
                <td colspan="2" align="center">
                    <font color="red" size="6" face="Times New Roman"><b>Анкета</b></font>
                </td>
            </tr>

            <tr>
                <td width="35%">1. Прізвище</td>
                <td><input type="text" name="surname" size="50"></td>
            </tr>
            <tr>
                <td>2. Ім'я, по батькові</td>
                <td><input type="text" name="name" size="50"></td>
            </tr>
            <tr>
                <td>3. Число і рік народження</td>
                <td><input type="text" name="birth" size="50"></td>
            </tr>
            <tr>
                <td>4. Домашня адреса</td>
                <td><input type="text" name="address" size="50"></td>
            </tr>
            <tr>
                <td>5. Місце навчання (роботи)</td>
                <td><input type="text" name="work" size="50"></td>
            </tr>
            <tr>
                <td>6. Домашній (робочий) телефон</td>
                <td><input type="text" name="phone" size="50"></td>
            </tr>
            <tr>
                <td>7. E-mail</td>
                <td><input type="text" name="email" size="50"></td>
            </tr>
            <tr>
                <td valign="top">8. Область наукових інтересів</td>
                <td>
                    <table width="100%" border="0">
                        <tr><td>1.</td><td><input type="text" name="interest1" size="40"></td></tr>
                        <tr><td>2.</td><td><input type="text" name="interest2" size="40"></td></tr>
                        <tr><td>3.</td><td><input type="text" name="interest3" size="40"></td></tr>
                        <tr><td>4.</td><td><input type="text" name="interest4" size="40"></td></tr>
                        <tr><td>5.</td><td><input type="text" name="interest5" size="40"></td></tr>
                        <tr><td>6.</td><td><input type="text" name="interest6" size="40"></td></tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="reset" value="Відмінити введення">
                    <br><br>
                    <input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
