<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3</title>
</head>
<body>
    <p align="center">
        <br><br><br><br>

        <!-- Рядок 1: alternate, up -->
        <marquee width="70%" height="350" bgColor="#1a1a2e" behavior="alternate" direction="up">
            <center>
                <font color="#e0e0e0" size="6">
                    Python — мова для штучного інтелекту
                </font>
                <br><br>
                <img src="image/python.png" alt="python" width="80">
            </center>
        </marquee>
        <br><br><br>

        <!-- Рядок 2: scroll, up -->
        <marquee width="70%" height="350" bgColor="#2d6a4f" behavior="scroll" direction="up">
            <center>
                <img src="image/python.png" alt="python" width="200">
                <br><br>
                <img src="image/Java_logo.svg" alt="java" width="150">
            </center>
        </marquee>
        <br><br><br>

        <!-- Рядок 3: slide, down -->
        <marquee width="70%" height="350" bgColor="#6a040f" behavior="slide" direction="down">
            <center>
                <img src="image/python.png" alt="python" width="100">
                <br>
                <img src="image/Java_logo.svg" alt="java" width="100">
            </center>
        </marquee>
        <br><br><br>

        <!-- Рядок 4: scroll, delay 40, up -->
        <marquee width="70%" height="350" bgColor="#023e8a" behavior="scroll" scrolldelay="40" direction="up">
            <center>
                <font color="#caf0f8" size="6">
                    Java використовують для великих проєктів
                </font>
            </center>
        </marquee>
        <br><br><br>

        <!-- Рядок 5: scroll, delay 150, up -->
        <marquee width="70%" height="350" bgColor="#3c096c" behavior="scroll" scrolldelay="150" direction="up">
            <center>
                <font color="#e0aaff" size="6">
                    Програмування — це навичка майбутнього
                </font>
            </center>
        </marquee>

    </p>
</body>
</html>
