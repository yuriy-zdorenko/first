<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
           * {
                margin: 0;
                box-sizing: border-box;
            }
            div {
                border: 1px solid white; 
            }
            .blue{
                background-color: blue;
                width: 100%;
                height: 25vh;
            }
            .grey{
                width: 20%;
                height: 80vh;
                background-color: grey;
            }
            .blues{
                width: 50%;
                height: 20vh;
                background-color: cyan;
            }
            .red{
                width: 50%;
                height: 20vh;
                background-color: red;
            }
            .yellow{
                height: 50vh;
                width: 30%;
                background-color: yellow;
            }
            .green{
                width: 100%;
                height: 35vh;
                background-color: green;
            }
            .brown{
                width: 100%;
                height: 20vh;
                background-color: brown;
            }
            @media (min-width: 576px) {
                .flex-red{
                    display: flex;
                    }
            }
            @media (max-width: 576px) {
                .blues{
                    width: 100%;
                    height: 200px;
                }
                .red{
                    width: 100%;
                    height: 200px;
                }
            }

            @media (min-width: 768px) {
                .flex-yellow{
                    display: flex;
                }
            }
            @media (max-width: 768px){
                .yellow{
                    width: 100%;
                    height: 200px;
                }
            }
            @media (max-width: 992px){
                .grey{
                    width: 100%;
                    height: 200px;
                }
            }
            @media (min-width: 992px) {
                .flex-grey{
                    display: flex;
                }
            }
            @media (min-width: 1200px) {

            }
        </style>
        <title>Document</title>
  
    </head>
    <body>
        <div class="flex-grey">
            <div style="width:100%;">
                <div class="blue"></div>
                    <div class="flex-yellow">
                        <div style="width:100%;">
                        <div class="flex-red">
                            <div class="blues"></div>
                            <div class="red"></div>
                        </div>
                        <div class="green"></div>
                    </div>
                        <div class="yellow"></div>
                    </div>
                </div>
                <div class="grey"></div>
            </div>
        <div class="brown"></div>
    </body>
</html>
