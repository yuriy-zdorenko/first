<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IvanennkoLab05-3</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background:#f5f5f5; display:flex; justify-content:center; }
    .table-wrap { width: 75%; max-width: 100%; }
    table { width: 100%; border-collapse: collapse; background:#fff; border: 2px solid #000; }
    th, td { border: 1px solid #000; padding: 8px; }
    .header { text-align: center; font-weight: normal; }
    .left { text-align: left; }
    .right { text-align: right; }
  </style>
</head>
<body>
  <div class="table-wrap">
    <table>
      <tr>
        <th class="header" colspan="2">Заголовок</th>
      </tr>
      <tr>
        <td class="left">Дані, вирівняні по лівому краю комірки</td>
        <td class="right">Дані, вирівняні по правому краю комірки</td>
      </tr>
      <tr>
        <td style="width:25%;">25% ширини таблиці</td>
        <td style="width:75%;">75% ширини таблиці</td>
      </tr>
    </table>
  </div>
</body>
</html>
