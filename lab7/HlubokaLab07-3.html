<html>
    <head>
        <meta charset="utf-8">
        <title>Створення форми для заповнення анкети</title>
    </head>
    <body>
        <form action="result.html" target="_blank">
            <table border="1" align="center" bgcolor="#ccffe6">
                <tr>
                    <th colspan="3">
                        <font color="red" size="7">Анкета</font>
                    </th>
                </tr>
                <tr>
                    <td align="center">1.</td>
                    <td>Прізвище</td>
                    <td><input type="text" name="lastname" size="30"></td>
                </tr>
                    <td align="center">2.</td>
                    <td>Ім'я, по батькові</td>
                    <td><input type="text" name="name" size="30"></td>
                <tr>
                    <td align="center">3.</td>
                    <td>Число і рік народження</td>
                    <td><input type="text" name="birthdate" size="30"></td>
                </tr>
                <tr>
                    <td align="center">4.</td>
                    <td>Домашня адоесса</td>
                    <td><input type="text" name="address" size="30"> </td>
                </tr>
                <tr>
                    <td align="center">5.</td>
                    <td>Місце навчання (роботи)</td>
                    <td><input type="text" name="study" size="30"></td>
                </tr>
                <tr>
                    <td align="center">6.</td>
                    <td>Домашній(робочий) телефон</td>
                    <td><input type="text" name="number" size="30"> </td>
                </tr>
                <tr>
                    <td align="center">7.</td>
                    <td>Email</td>
                    <td><input type="text" name="login" size="30" maxlength="30"> </td>
                </tr>
                <tr>
                    <td align="center">8.</td>
                    <td>Область наукових інтересів</td>
                    <td align="center">
                        1.<input type="text" name="text1" size="20"> <br>
                        2.<input type="text" name="text2" size="20"> <br>
                        3.<input type="text" name="text3" size="20"><br>
                        4.<input type="text" name="text4" size="20"><br>
                        5.<input type="text" name="text5" size="20"><br>
                        6.<input type="text" name="text6" size="20"><br>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="reset" value="Відмінити введення"><br><br>
                        <input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації"><br><br>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
