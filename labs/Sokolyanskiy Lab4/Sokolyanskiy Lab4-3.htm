<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Вертикальні рядки, що біжать</title>
</head>
<body background="images/fon.jpg" text="#FFFAFA">
  <p align="center">
    <br><br><br>
    <marquee width="800" height="180" bgcolor="#99ff00" direction="up" behavior="alternate" scrollamount="6">
      <font color="#8b008b" face="Verdana" size="4"><b>1. Текст та рисунки у рядку коливаються.</b></font><br>
      <img src="images/1.png" width="240" height="120" alt="Рисунок 1">
    </marquee>
    <br><br>
    <marquee width="800" height="220" bgcolor="#ff9999" direction="up" behavior="scroll" scrollamount="6">
      <img src="images/2.png" width="240" height="120" alt="Рисунок 2"><br>
      <img src="images/3.png" width="240" height="120" alt="Рисунок 3"><br>
      <img src="images/4.png" width="240" height="120" alt="Рисунок 4">
    </marquee>
    <br><br>
    <marquee width="800" height="360" bgcolor="#99ccff" direction="down" behavior="slide" scrollamount="6">
      <img src="images/2.png" width="240" height="120" alt="Рисунок 2"><br>
      <img src="images/3.png" width="240" height="120" alt="Рисунок 3"><br>
      <img src="images/4.png" width="240" height="120" alt="Рисунок 4">
    </marquee>
    <br><br>
    <marquee width="800" height="120" bgcolor="#ffff99" direction="up" behavior="scroll" scrollamount="4" scrolldelay="30">
      <font color="#800000" face="Verdana" size="4"><b>4. Текст переміщується з меншим запізненням.</b></font>
    </marquee>
    <br><br>
    <marquee width="800" height="120" bgcolor="#cc99ff" direction="down" behavior="scroll" scrollamount="4" scrolldelay="120">
      <font color="#003300" face="Verdana" size="4"><b>5. Текст переміщується з більшим запізненням.</b></font>
    </marquee>
    <br><br>
  </p>
</body>
</html>
