<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Завдання 1</title>
</head>
<body style="background-color: #f0f7fb; padding: 30px; font-family: 'Segoe UI', Arial, sans-serif;">

    <p style="font-family: Georgia, serif;
              font-size: 16pt;
              font-style: italic;
              font-weight: normal;
              color: #0b3c5d;
              text-align: left;
              text-indent: 25%;
              line-height: 1.8;
              letter-spacing: 0.5px;
              background-color: #d8ebf9;
              padding: 20px;
              border-left: 6px solid #328cc1;
              border-radius: 4px;">
        Я із надій будую човен,<br>
        І вже немовби наяву<br>
        З тобою, ніжний, срібномовен,<br>
        По морю радості пливу.
    </p>

    <p style="font-family: 'Trebuchet MS', Arial, sans-serif;
              font-size: 15pt;
              font-weight: bold;
              font-style: normal;
              color: #1d2731;
              text-align: right;
              text-decoration: underline;
              text-transform: capitalize;
              line-height: 2.1;
              letter-spacing: 1px;
              background-color: #b9dcf2;
              padding: 20px;
              border-right: 6px solid #1d6fa5;
              border-radius: 4px;">
        І гомонять навколо хвилі,<br>
        З бортів човна змивають мох,<br>
        І ми з тобою вже не в силі<br>
        Буть нещасливими удвох.
    </p>

</body>
</html>
