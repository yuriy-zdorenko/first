<html>
<head>
<meta charset="utf-8">
<title>Рядки, що біжать</title>
</head>
<body bgcolor="#FFFFFF">

<marquee width="100%" height="50" bgcolor="#FFCCCC" behavior="alternate">
<font color="#FF0000" face="Arial" size="4">
Рядок коливається з боку в бік
</font>
</marquee>

<marquee width="100%" height="50" bgcolor="#CCFFCC" direction="left" behavior="scroll">
<font color="#008000" face="Verdana" size="4">
Рядок рухається справа наліво та з'являється знову
</font>
</marquee>

<marquee width="100%" height="50" bgcolor="#CCCCFF" direction="right" behavior="slide">
<font color="#0000FF" face="Arial" size="4">
Рядок рухається зліва направо та зупиняється
</font>
</marquee>

<marquee width="100%" height="50" bgcolor="#FFFFCC" scrolldelay="50">
<font color="#CC6600" face="Tahoma" size="4">
Рядок із малою затримкою
</font>
</marquee>

<marquee width="100%" height="50" bgcolor="#FFCCFF" scrolldelay="180">
<font color="#800080" face="Verdana" size="4">
Рядок із більшою затримкою
</font>
</marquee>

</body>
</html>
