<!DOCTYPE html>
<HTML>
    <HEAD>
        <meta charset="UTF-8">
        <TITLE>Сенсорне зображення довільної форми</TITLE>
    </HEAD>
    <BODY BGCOLOR="#E6E6FA" TEXT="#000000">
        <H2 ALIGN="CENTER">Інтерактивна карта природних об'єктів</H2>

        <MAP NAME="nature_map">
            <AREA SHAPE="poly" COORDS="20,20,100,10,120,80,50,100" HREF="#" TITLE="Лісова зона — місце відпочинку" ALT="Ліс">
            <AREA SHAPE="poly" COORDS="150,30,250,20,280,90,200,120,130,70" HREF="#" TITLE="Гірське озеро з чистою водою" ALT="Озеро">
            <AREA SHAPE="poly" COORDS="0,150,400,150,400,250,0,250" HREF="#" TITLE="Квітуче поле та луки" ALT="Поле">
        </MAP>

        <P ALIGN="CENTER">
            <IMG SRC="nature.png" WIDTH="400" HEIGHT="250" BORDER="2" USEMAP="#nature_map" ALT="Природа">
        </P>
    </BODY>
</HTML>
