<html>
    <head>
        <meta charset="utf-8">
        <title>Бігаючі рядки</title>
    </head>
    <body bgcolor="#ced5e0" text="#50678c">
        <table align="center">
            <tr align="center">
                <td>
                    <marquee bgColor="#48b5a7" height="550" width="80" direction="down" behavior="alternate">
                        <font size="5" color="#4263a6">Тут є фото</font> <br> <br>
                        <img src="images/dog1.jpg" alt="Фото собаки" height="60" width="70"> <br> <br>

                        <img src="images/dog2.jpg" alt="Фото собаки" height="60" width="70"> <br><br>
                        <img src="images/dog3.jpg" alt="Фото собаки" height="60" width="70"> <br><br>

                    </marquee>
                </td>
                <td>
                    <marquee bgColor="green" height="550" width="80" direction="up" behavior="scroll">
                        <img src="images/wether winter.jpg" height="60" width="70" alt="Зима"> <br> <br> <br>
                        <img src="images/spring.jpg" height="60" width="70" alt="Весна"> <br> <br> <br>
                        <img src="images/summer.jpg" height="60" width="70" alt="Літо"> <br> <br> <br>
                        <img src="images/autumn.jpg" height="60" width="70" alt="Осінь"> <br> <br> <br>

                    </marquee>
                </td>

                <td>
                    <marquee bgColor="red" height="550" width="80" direction="down" behavior="slide">

                        <img src="images/autumn.jpg" height="60" width="70" alt="Осінь"> <br> <br> <br>
                        <img src="images/summer.jpg" height="60" width="70" alt="Літо"> <br> <br> <br>

                        <img src="images/wether winter.jpg" height="60" width="70" alt="Зима"> <br> <br> <br>
                        
                        
                    </marquee>
                </td>

                <td>
                    <marquee bgColor="purple" height="550" width="80" direction="down" behavior="scroll" scrolldelay="20">
                        <img src="images/wether.jpg" height="80" width="70" alt="Зима"> <br> <br> <br>

                        <img src="images/wether winter.jpg" height="60" width="70" alt="Зима"> <br> <br> <br>
                        
                        
                    </marquee>
                </td>

                <td>
                    <marquee bgColor="yellow" height="550" width="80" direction="down" behavior="scroll" scrolldelay="155">
                        <img src="images/wether.jpg" height="80" width="70" alt="Зима"> <br> <br> <br>
                        <img src="images/autumn.jpg" height="60" width="70" alt="Осінь"> <br> <br> <br>
                        <img src="images/summer.jpg" height="60" width="70" alt="Літо"> <br> <br> <br>
                        <img src="images/spring.jpg" height="60" width="70" alt="Весна"> <br> <br> <br>
                        <img src="images/wether winter.jpg" height="60" width="70" alt="Зима"> <br> <br> <br>
                        
                        
                    </marquee>

            </tr>
        </table>

</html>
