<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Завдання 4.1</title>
    </head>
    <body>
        <p align="center">
            <marquee bgcolor="#EB7083" behavior="Alternate" height="50"><b>
                <br>Приклад рядка, що біжить(збоку в бік)
            </b></marquee>
            <br><br><br>
            <marquee direction="left" behavior="scroll" bgcolor="#FDA55D" width="50%"><font size="6">
                Приклад рядка, що біжить(справа на ліво та з'являється знову)
            </font></marquee>
            <br><br><br>
            <marquee direction="right" behavior="slide" bgcolor="#841F1F" width="500"><font color="#FFFFFF">
                Приклад рядка, що біжить(зліва на право та зупиняється)
            </font></marquee>
            <br><br><br>
            <marquee scrolldelay="500" bgcolor="#508F54" width="10%">
                Приклад рядка, що біжить(запізнювання 500)
            </marquee>
            <br><br><br>
            <marquee scrolldelay="50" scrollamount="1" bgcolor="#50828F" height="30">
                 Приклад рядка, що біжить(запізнювання 50)
            </marquee>
        </p>
    </body>
</html>
