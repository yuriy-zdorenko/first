<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Рядок, що біжить</title>
</head>		
<body bgcolor="purple">
    <marquee height=70 width="100%" bgColor="blue" behavior="alternate" direction="Up" scrollamount="17">
        <font color="black" face="Comic Sans MS" size="5">
            Біжить текст не швидко туди-сюди
        </font>
    </marquee>
    <marquee height=70 width="100%" bgColor="blue" behavior="scroll" direction="Up" scrollamount="15">
        <font color="yellow" face="Times New Roman" size="6">
            Біжить текст не швидко. Пропада і появляється
        </font>
    </marquee>
    <marquee height=70 width="100%" bgColor="blue" behavior="slide" direction="Up" scrollamount="15">
        <font color="pink" face="Casual" size="4">
            Біжить текст не швидко і зупиняється
        </font>
    </marquee>
        <marquee height=100 width="100%" bgColor="blue" behavior="scroll" direction="Up" scrollamount="15" scrolldelay="100">
        <font color="green" face="Aptos" size="6">
            Біжить текст не швидко.  Пропада і появляється із затримкою в 100
        </font>
    </marquee>
        <marquee height=100 width="100%" bgColor="blue" behavior="scroll" direction="Up" scrollamount="15" scrolldelay="200">
        <font color="grey" face="Calibri" size="5">
            Біжить текст не швидко.  Пропада і появляється із затримкою в 200
        </font>
    </marquee>
</body>
</html>
