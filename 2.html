<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
</head>
<body>
    <a href="https://google.com" id="link1">Посилання 1</a><br>
    <a href="https://youtube.com" id="link2">Посилання 2</a><br>
    <a href="https://gmail.com" id="link3">Посилання 3</a>

    <script>
        // Функція для обробки події
    function handleMouseOver(event) {
            // Присвоюємо значення href атрибуту title
            event.target.title = event.target.href;
        }

        // Отримуємо елементи посилань
    const link1 = document.getElementById('link1');
    const link2 = document.getElementById('link2');
    const link3 = document.getElementById('link3');

            // Додаємо обробник події для кожного посилання
    link1.addEventListener('mouseover', handleMouseOver);
    link2.addEventListener('mouseover', handleMouseOver);
    link3.addEventListener('mouseover', handleMouseOver);
    </script>
</body>
</html>
