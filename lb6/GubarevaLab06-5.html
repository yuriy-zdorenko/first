<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <TITLE>Сонячна система - Сенсорне зображення</TITLE>
    </head>
    <body>
        <center>
            <h1>Сонячна система</h1>
            <p>Наведіть курсор на Сонце або планети, щоб дізнатися цікаву інформацію!</p>
            <br>

            <!-- Карта зображення розмір 800x448 -->
            <map name="solar_map">
                <!-- Сонце (центр) -->
                <area shape="circle" coords="430,225,45" href="#" title="Сонце — зоря, навколо якої обертаються всі планети Сонячної системи.">

                <!-- Меркурій (праворуч від Сонця) -->
                <area shape="circle" coords="505,225,14" href="#" title="Меркурій — найближча до Сонця планета, найменша у Сонячній системі.">

                <!-- Юпітер -->
                <area shape="circle" coords="625,145,15" href="#" title="Юпітер — найбільший газовий гігант у Сонячній системі.">
            </map>

            <!-- Зображення сонячної системи -->
            <img src="image/cosmos.jpg" width="800" height="448" alt="Сонячна система" usemap="#solar_map" border="0">
        </center>
    </body>
</html>
