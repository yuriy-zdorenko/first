<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Вертикальні рядки, що біжуть</title>
</head>              
<BODY BGCOLOR="#FFF5EE" TEXT="#000000">
   <P ALIGN="CENTER">
   <BR>

    <marquee width="400" bgColor="#FFE4E1" height="130" direction="up" behavior="alternate">
        <FONT color="#CD5C5C" FACE="Arial" Size="4"><B>1. Текст коливається у вертикальному напрямку</B></FONT>
    </marquee>
    <BR><BR>

    <marquee width="400" bgColor="#E0FFFF" height="130" direction="up" behavior="scroll">
        <CENTER>
        <IMG SRC="pic1.jpg" ALT="Малюнок 1" WIDTH="40" HEIGHT="40">
        <IMG SRC="pic2.jpg" ALT="Малюнок 2" WIDTH="40" HEIGHT="40"><BR>
        <FONT color="#008B8B" FACE="Verdana" Size="3"><B>2. Рисунки знизу догори</B></FONT>
        </CENTER>
    </marquee>
    <BR><BR>

    <marquee width="400" bgColor="#F5DEB3" height="130" direction="down" behavior="slide">
        <CENTER>
        <IMG SRC="pic3.jpg" ALT="Малюнок 3" WIDTH="40" HEIGHT="40"><BR>
        <FONT color="#8B4513" FACE="Tahoma" Size="3"><I>3. Рисунки згори донизу із зупинкою</I></FONT>
        </CENTER>
    </marquee>
    <BR><BR>

    <marquee width="400" bgColor="#FAFAD2" height="130" direction="up" scrolldelay="250">
        <FONT color="#556B2F" FACE="Times New Roman" Size="4">4. Вертикальний рух з великим запізненням</FONT>
    </marquee>
    <BR><BR>

    <marquee width="400" bgColor="#E6E6FA" height="130" direction="up" scrolldelay="40">
        <FONT color="#483D8B" FACE="Courier New" Size="4">5. Вертикальний рух з малим запізненням</FONT>
    </marquee>
    <BR><BR>
   </P>
</BODY>
</html>
