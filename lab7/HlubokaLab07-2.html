<!DOCTYPE html>
<html>
<head>

<body>
    <h2>Завдання 2. Комплексна форма зі всіма елементами</h2>

    <form action="result.html" target="_blank">
    <p>
        Персональні дані <br>
        Логін:  <input type="text" name="login" size="20" maxlength="30"> <br>
        Пароль: <input type="password" name="pass" size="20">
        <br><br>
        Стать:  <input type="radio" name="pol" value="male"> Чоловіча
                <input type="radio" name="pol" value="female"> Жіноча
        <br><br><br>
        Інша додаткова інформація <br><br>
        Місто проживання: 
        <select name="city" size="1">
            <option value="poltava">Полтава</option>
            <option value="kyiv">Київ</option>
        </select> <br>
        Захоплення:
        <input type="checkbox" name="hobby1" value="coding"> Програмування
        <input type="checkbox" name="hobby2" value="reading"> Читання
        <br><br><br>
        Прикріпити файл: <input type="file" name="file">
        <br><br><br>
        Про себе: <br>
        <textarea name="about" rows="5" cols="50"></textarea>
        <br><br><br>
       
            <input type="submit" value="Надіслати">
            <input type="reset" value="Скасувати">
        
    </p>
    </form>
</body>
