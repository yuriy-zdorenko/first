<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    height: 100%; 
  }
  body { 
    font-family: Arial, Helvetica, sans-serif; 
    background: #fff; 
  }

  .wrapper {
    height: 100vh; height: 100dvh;
    display: flex;
    flex-wrap: wrap;
  }
  .body, .left, .lower, .col, .pair { 
    display: contents; 
  }

  .block {
    flex: none;
    margin: 3px;
    border: 1px solid #d9d9d9;
    color: #fff;
    font-weight: bold;
    text-align: center;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .header { 
    background: #5b9bd5; 
    order: 1; 
  }
  .aside  { 
    background: #6f7f83; 
    order: 2; 
  }
  .a      { 
    background: #5fd3d3; 
    order: 3; 
  }
  .b      { 
    background: #e06c6c; 
    order: 4; 
  }
  .main   { 
    background: #ffc000; 
    order: 5; 
  }
  .d      { 
    background: #31a672; 
    order: 6; 
  }
  .footer { 
    background: #c55a11; 
    order: 7; 
  }

  .header::after { 
    content: "flexbox · <500px"; 
    font-size: 12px; 
    font-weight: normal; 
    margin-left: 8px; 
    opacity: .85; 
  }

  /* <500px */
  .block { 
    width: calc(100% - 6px); 
    height: calc(100% / 7 - 6px); 
  }

  /* ≥500px */
  @media (min-width: 500px) {
    .block { height: calc(20% - 6px); }
    .header, .d, .footer { width: calc(100% - 6px); }
    .aside, .a, .b, .main { width: calc(50% - 6px); }
    .header::after { content: "flexbox · ≥500px"; }
  }

  /* ≥750px */
  @media (min-width: 750px) {
    .block { height: calc(25% - 6px); }
    .header, .footer { width: calc(100% - 6px); }
    .aside { width: calc(20% - 6px); }
    .a, .b { width: calc(40% - 6px); }
    .main  { width: calc(60% - 6px); }
    .d     { width: calc(40% - 6px); }
    .header::after { content: "flexbox · ≥750px"; }
  }

  /* ≥950px */
  @media (min-width: 950px) {
    .body  { display: flex; flex: 0 0 100%; height: 79%; }
    .left  { display: flex; flex-direction: column; flex: 0 0 75%; }
    .lower { display: flex; flex-wrap: wrap; flex: 1 1 0; }

    .header, .aside, .a, .b, .main, .d, .footer { order: 0; }
    .d { order: 1; }

    .header { 
      flex: none; 
      width: auto; 
      height: calc(31.6456% - 6px); 
    } 
    .aside  { 
      flex: 0 0 calc(25% - 6px); 
      width: auto; 
      height: auto; 
    }
    .a, .b  { 
      width: calc(50% - 6px); 
      height: calc(42.5926% - 6px); 
    } 
    .main, .d { 
      width: calc(50% - 6px); 
      height: calc(57.4074% - 6px); 
    } 
    .footer { 
      width: calc(100% - 6px); 
      height: calc(21% - 6px); 
    }
    .header::after { 
      content: "flexbox · ≥950px"; 
    }
  }

  /* ≥1200px */
  @media (min-width: 1200px) {
    .left  { flex: 0 0 80%; }
    .lower { flex-wrap: nowrap; }
    .col   { display: flex; flex-direction: column; flex: 0 0 62.5%; }
    .pair  { display: flex; flex: none; height: 44.898%; }  

    .d { order: 0; }
    .header { height: calc(37.9747% - 6px); }  
    .a, .b  { flex: 1 1 0; width: auto; height: auto; }
    .d      { flex: 1 1 0; width: auto; height: auto; }
    .main   { flex: 0 0 calc(37.5% - 6px); width: auto; height: auto; }
    .aside  { flex: 0 0 calc(20% - 6px); }
    .header::after { content: "flexbox · ≥1200px"; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="body">
      <div class="left">
        <div class="block header">header</div>
        <div class="lower">
          <div class="col">
            <div class="pair">
              <div class="block a">A</div>
              <div class="block b">B</div>
            </div>
            <div class="block d">D</div>
          </div>
          <div class="block main">main</div>
        </div>
      </div>
      <div class="block aside">aside</div>
    </div>
    <div class="block footer">footer</div>
  </div>
</body>
</html>
