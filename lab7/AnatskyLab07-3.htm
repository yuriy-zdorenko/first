<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Анкета</title>
</head>
<body>
    <h2>Завдання 3. Створення анкети</h2>
  <form action="#" method="post">
    <table border="1" width="580" cellspacing="4" cellpadding="8" bgcolor="#D4EEFF">

      <!-- Заголовок -->
      <tr>
        <td colspan="3" align="center">
          <h1><font color="red">Анкета</font></h1>
        </td>
      </tr>

      <!-- 1 -->
      <tr>
        <td width="30" align="center">1.</td>
        <td width="230">Прізвище</td>
        <td><input type="text" name="surname" size="42"></td>
      </tr>

      <!-- 2 -->
      <tr>
        <td align="center">2.</td>
        <td>Ім'я, по батькові</td>
        <td><input type="text" name="name" size="42"></td>
      </tr>

      <!-- 3 -->
      <tr>
        <td align="center">3.</td>
        <td>Число і рік народження</td>
        <td><input type="text" name="birthdate" size="42"></td>
      </tr>

      <!-- 4 -->
      <tr>
        <td align="center">4.</td>
        <td>Домашня адреса</td>
        <td><input type="text" name="address" size="42"></td>
      </tr>

      <!-- 5 -->
      <tr>
        <td align="center">5.</td>
        <td>Місце навчання (роботи)</td>
        <td><input type="text" name="place" size="42"></td>
      </tr>

      <!-- 6 -->
      <tr>
        <td align="center">6.</td>
        <td>Домашній (робочий) телефон</td>
        <td><input type="text" name="phone" size="42"></td>
      </tr>

      <!-- 7 -->
      <tr>
        <td align="center">7.</td>
        <td>E-mail</td>
        <td><input type="text" name="email" size="42"></td>
      </tr>

      <!-- 8 -->
      <tr>
        <td valign="top" align="center">8.</td>
        <td valign="top">Область наукових інтересів</td>
        <td>
          <ol>
            <li><input type="text" name="interest1" size="32"></li>
            <li><input type="text" name="interest2" size="32"></li>
            <li><input type="text" name="interest3" size="32"></li>
            <li><input type="text" name="interest4" size="32"></li>
            <li><input type="text" name="interest5" size="32"></li>
            <li><input type="text" name="interest6" size="32"></li>
          </ol>
        </td>
      </tr>

      <!-- Кнопки -->
      <tr>
        <td colspan="3">
          <p><input type="reset" value="Відмінити введення"></p>
          <p><input type="submit" value="Надіслати дані та перейти до 2 етапу реєстрації"></p>
        </td>
      </tr>

    </table>
  </form>

</body>
</html>
