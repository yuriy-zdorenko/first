<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Лабораторна робота №4-01 Чебикін Богдан</title>
</head>

<body>

<p align="center", style="font-family:Times New Roman; font-size: large;">
	
		<marquee bgColor="#0000FF",behavior="alternate", height=30>
			Рядок, що біжить 1
		</marquee>
		
</p>

<p align="center", style="font-family:Times New Roman; font-size: large;">
	
		<marquee bgColor="#3D2B1F" ,behavior="scroll", direction="left", height=30>
			Рядок, що біжить 2
		</marquee>
		
</p>

<p align="center", style="font-family:Times New Roman; font-size: large;">
	
		<marquee bgColor="#E0FFFF" behavior="slide", direction="right", height=30>
			Рядок, що біжить 3
		</marquee>
		
</p>

<p align="center", style="font-family:Times New Roman; font-size: large;">
	
		<marquee bgcolor="#8A2BE2" ,behavior="scroll", direction="right",scrolldelay=100 ,height=30>
			Рядок, що біжить 4, з часом запізнення в 100мс
		</marquee>
		
</p>
<p align="center", style="font-family:Times New Roman; font-size: large;">
	
		<marquee bgcolor="#66FF00",behavior="scroll", direction="right", scrolldelay=200 ,height=30>
			Рядок, що біжить 5, з часом запізнення в 200мс
		</marquee>
		
</p>


</body>
